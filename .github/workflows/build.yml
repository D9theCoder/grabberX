name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix electron
      - run: npm run typecheck
      - run: npm test

      - name: Page tests against the dev server
        run: |
          npx playwright install chromium
          npm run test:e2e

      # Every push to main is a release: bump the patch version in all four files, commit it back, then build with it.
      # The bump commit is pushed with GITHUB_TOKEN, which GitHub never re-triggers a workflow for, so there is no loop.
      - name: Bump the version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          npm version patch --no-git-tag-version
          (cd electron && npm version "$(node -p "require('../package.json').version")" --no-git-tag-version --allow-same-version)
          git commit -am "chore: release $(node -p "require('./package.json').version")"
          git push

      # The update target is this repository, so no owner or name is hardcoded. Without the signing secrets the
      # empty values below mean "unsigned"; add CSC_LINK (base64 .pfx) and CSC_KEY_PASSWORD to sign the installer.
      - name: Build the installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        # bash, not the default PowerShell: PowerShell splits `-c.publish.repo=x` at the dot. `--publish never`:
        # on a push (not a PR) electron-builder would otherwise try to publish itself; the release step below does that.
        shell: bash
        run: |
          npm run dist -- \
            --publish never \
            -c.publish.provider=github \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }}

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $env:GATHER_EXE = "$PWD\release\win-unpacked\grabberX.exe"
          npm run test:e2e:packaged

      - uses: actions/upload-artifact@v4
        with:
          name: grabberX-Setup
          path: |
            release/grabberX-Setup-*.exe
            release/grabberX-Setup-*.exe.blockmap
            release/latest.yml

      - name: Publish a release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # latest.yml and the blockmap are what the installed app reads to find and download an update.
        # On main the tag is created here, pointing at the bump commit; a pushed v* tag is released as it is.
        run: |
          $version = node -p "require('./package.json').version"
          $files = Get-ChildItem release\grabberX-Setup-*.exe, release\grabberX-Setup-*.exe.blockmap, release\latest.yml
          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            gh release create "${{ github.ref_name }}" $files --generate-notes
          } else {
            gh release create "v$version" $files --generate-notes --target (git rev-parse HEAD)
          }
