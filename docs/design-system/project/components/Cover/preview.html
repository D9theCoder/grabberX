<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>gather — cover</title>
<style>
  body { margin: 0; background: var(--paper); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); }
  .art { position: absolute; left: 480px; top: 0; width: 480px; height: 300px; }
  .ink { fill: var(--ink); }
  .sunken { fill: var(--sunken); }
  .strong { fill: var(--line-strong); }
  .danger { fill: var(--danger); }
  .dot { fill: var(--ink-2); }
  .rule { stroke: var(--line); stroke-width: 1; }
  .r-lg { rx: var(--radius-lg); }
  .r-md { rx: var(--radius-md); }
  .name { position: absolute; left: 48px; bottom: 44px; max-width: 440px; }
  .name h1 { margin: 0; font-family: var(--font-sans); font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: -0.04em; color: var(--ink); }
  .name p { margin: 12px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-2); }
</style></head>
<body>
<div class="cover">
  <!--
    blocks: ink slab 168x236 (radius-lg) bleeding off the top; sunken field 216x168 (radius-lg); line-strong band 48x144 bleeding off the right; one danger square 24x24 (radius-md), small because red only ever means a failure.
    arrangement: one tall slab with satellites, everything right of x = 480.
    pattern: dot grid at a 24px pitch (space-6) on the sunken field, 8x6 = 48 dots in ink-2; chosen because the system is monochrome, mono-typed and built on a 4px grid: precise and technical.
    scales: space-4 / space-6 / space-8 gaps, radius-lg on blocks, radius-md on the square, one line hairline as the baseline.
  -->
  <svg class="art" viewBox="0 0 480 300" aria-hidden="true">
    <defs>
      <pattern id="dots" x="12" y="108" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle class="dot" cx="12" cy="12" r="1.6"></circle>
      </pattern>
    </defs>
    <line class="rule" x1="0" y1="268.5" x2="480" y2="268.5"></line>
    <rect class="sunken r-lg" x="16" y="100" width="216" height="168"></rect>
    <rect x="16" y="100" width="216" height="168" fill="url(#dots)"></rect>
    <rect class="ink r-lg" x="264" y="-8" width="168" height="244"></rect>
    <rect class="strong r-lg" x="448" y="124" width="48" height="144"></rect>
    <rect class="danger r-md" x="448" y="76" width="24" height="24"></rect>
  </svg>
  <div class="name">
    <h1>gather</h1>
    <p>A quiet front end for gallery-dl.</p>
  </div>
</div>
</body>
</html>
