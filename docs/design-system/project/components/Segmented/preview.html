<!doctype html>
<html>
<head><meta charset="utf-8"><title>Segmented — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo g-demo--col" style="gap:16px"></div>
<script>
  var G = window.Gather, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(G.Segmented, { label: 'Site', defaultValue: 'x', options: [{ value: 'x', label: 'X' }, { value: 'ig', label: 'Instagram', tag: 'beta' }, { value: 'bsky', label: 'Bluesky', tag: 'beta' }, { value: 'pixiv', label: 'Pixiv', tag: 'beta' }, { value: 'url', label: 'Other URL' }] }),
  h(G.Segmented, { label: 'Media', defaultValue: 'All', options: ['Images', 'Videos', 'All'] }),
  h(G.Segmented, { label: 'Dates', size: 'sm', defaultValue: 'Custom', options: ['All time', 'Last 30 days', 'This year', 'Custom'] })));
</script>
</body>
</html>
