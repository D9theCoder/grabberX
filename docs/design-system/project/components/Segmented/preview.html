<!doctype html>
<html>
<head><meta charset="utf-8"><title>Segmented — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo g-demo--col" style="gap:16px"></div>
<script>
  var G = window.grabberX, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(G.Segmented, { label: 'Site', defaultValue: 'x', columns: 3, options: [{ value: 'x', label: 'X' }, { value: 'ig', label: 'Instagram', title: 'Instagram (beta)' }, { value: 'bsky', label: 'Bluesky', title: 'Bluesky (beta)' }, { value: 'pixiv', label: 'Pixiv', title: 'Pixiv (beta)' }, { value: 'reddit', label: 'Reddit', title: 'Reddit (beta)' }, { value: 'url', label: 'Other URL', title: 'Other URL (beta)' }] }),
  h(G.Segmented, { label: 'Media', defaultValue: 'All', options: ['Images', 'Videos', 'All'] }),
  h(G.Segmented, { label: 'Dates', columns: 2, defaultValue: 'Custom', options: ['All time', 'Last 30 days', 'This year', 'Custom'] })));
</script>
</body>
</html>
