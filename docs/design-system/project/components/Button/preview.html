<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo"></div>
<script>
  var G = window.grabberX, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(G.Button, { variant: 'primary' }, 'Download'),
  h(G.Button, null, 'Preview files'),
  h(G.Button, { variant: 'ghost' }, 'Open folder'),
  h(G.Button, { variant: 'danger' }, 'Stop'),
  h(G.Button, { variant: 'primary', loading: true }, 'Starting'),
  h(G.Button, { disabled: true }, 'Download')));
</script>
</body>
</html>
