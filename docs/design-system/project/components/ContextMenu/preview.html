<!doctype html>
<html>
<head><meta charset="utf-8"><title>ContextMenu — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo"></div>
<script>
  var G = window.Gather, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(G.ContextMenu, { label: '1800000000000000001_1.jpg', items: [
    { label: 'Open', icon: 'expand', shortcut: 'Enter' },
    { label: 'Show in folder', icon: 'folder' },
    { label: 'Open with default app', icon: 'open' },
    '-',
    { label: 'Download', icon: 'download' },
    { label: 'Copy path', icon: 'copy' },
    { label: 'Select', icon: 'select' },
    '-',
    { label: 'Delete', icon: 'trash', shortcut: 'Del', danger: true }
  ] }));
</script>
</body>
</html>
