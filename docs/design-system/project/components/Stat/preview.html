<!doctype html>
<html>
<head><meta charset="utf-8"><title>Stat — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo g-demo--col" style="max-width:400px"></div>
<script>
  var G = window.grabberX, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'g-stats' },
  h(G.Stat, { value: 312, label: 'saved' }),
  h(G.Stat, { value: 1090, label: 'skipped', tone: 'muted' }),
  h(G.Stat, { value: 2, label: 'failed', tone: 'danger' })));
</script>
</body>
</html>
