<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo g-demo--col" style="max-width:520px;gap:0"></div>
<script>
  var G = window.grabberX, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(G.Switch, { label: 'Stop when caught up', hint: 'Stops after 20 files in a row are already saved.', defaultChecked: true }),
  h(G.Switch, { label: 'Save metadata', hint: 'Writes a .json file beside each download.' }),
  h(G.Switch, { label: 'Include retweets' })));
</script>
</body>
</html>
