<!doctype html>
<html>
<head><meta charset="utf-8"><title>Notice — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo g-demo--col" style="max-width:480px;gap:20px"></div>
<script>
  var G = window.Gather, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(G.Notice, { tone: 'warning', title: 'Rate limited · retrying in 0:42 (2 of 4)' }),
  h(G.Notice, { tone: 'danger', title: 'X asked for a login', action: h(G.Button, { size: 'sm' }, 'Run again') }, 'Open x.com in Firefox, sign in, then run again.'),
  h(G.Notice, { tone: 'info' }, "Existing files use a different layout. They won't be moved, and nothing is downloaded twice.")));
</script>
</body>
</html>
