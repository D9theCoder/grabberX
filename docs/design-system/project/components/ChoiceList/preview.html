<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChoiceList — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo g-demo--col" style="max-width:520px"></div>
<script>
  var G = window.Gather, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(G.ChoiceList, { legend: 'Folders', defaultValue: 'type', options: [
  { value: 'type', label: 'By type', detail: 'username/Image/  ·  username/Video/' },
  { value: 'year', label: 'By type and year', detail: 'username/Image/2025/  ·  username/Video/' },
  { value: 'month', label: 'By month', detail: 'username/2025-03/' },
  { value: 'flat', label: 'Flat', detail: 'username/' },
  { value: 'custom', label: 'Custom template', detail: '{date:%Y}/{tweet_id}_{num}.{extension}' }] }));
</script>
</body>
</html>
