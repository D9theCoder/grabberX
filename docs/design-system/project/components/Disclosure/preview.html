<!doctype html>
<html>
<head><meta charset="utf-8"><title>Disclosure — preview</title>
<style>body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root" class="g g-demo g-demo--col" style="max-width:560px;gap:0"></div>
<script>
  var G = window.Gather, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(G.Disclosure, { title: 'Advanced', meta: '2 changed', defaultOpen: true },
  h(G.Switch, { label: 'Stop when caught up', hint: 'Stops after 20 files in a row are already saved.', defaultChecked: true }),
  h(G.TextField, { label: 'Bandwidth cap', mono: true, defaultValue: '2M', hint: 'For example 500k or 2M.' })));
</script>
</body>
</html>
